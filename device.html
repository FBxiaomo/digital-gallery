(function(){

function parseNum(v) { if (!v) return null; const n = parseFloat(String(v).replace(/[,~\s]/g, '')); return isNaN(n) ? null : n; }
function getPerfSchemes(s) {

  const isEstimated = function(keys) { return keys.some(function(key) { return /[~～]|估算|拟合/.test(String(s[key] || '')); }); };
  const gpuKey = wle !== null ? '3DMark WLE' : 'GFXBench Manhattan 3.1';
  if (g6s && g6m && gpu) {
    schemes.A = { value: ((g6s/PERF_BASELINE.GB6s)*0.375 + (g6m/PERF_BASELINE.GB6m)*0.375 + (gpu/PERF_BASELINE.WLE)*0.25) * 100, estimated: wle === null || isEstimated(['GeekBench 6 单核', 'GeekBench 6 多核', gpuKey]), scheme: 'A' };
  }
  if (g5s && g5m && gpu) {
    schemes.B = { value: ((g5s/PERF_BASELINE.GB5s)*0.30 + (g5m/PERF_BASELINE.GB5m)*0.40 + (gpu/PERF_BASELINE.WLE)*0.30) * 100, estimated: wle === null || isEstimated(['GeekBench 5 单核', 'GeekBench 5 多核', gpuKey]), scheme: 'B' };
  }
  const antutuCpu = readScore('安兔兔 SoC CPU'), antutuGpu = readScore('安兔兔 SoC GPU');
  if (antutuCpu && antutuGpu) {
    const wCpu = PERF_ANTUTU_WEIGHT.cpu, wGpu = PERF_ANTUTU_WEIGHT.gpu;
    schemes.C = { value: (antutuCpu*wCpu + antutuGpu*wGpu) / (PERF_BASELINE.antutuCpu*wCpu + PERF_BASELINE.antutuGpu*wGpu) * 100, estimated: isEstimated(['安兔兔 SoC CPU', '安兔兔 SoC GPU']), scheme: 'C' };

function sortKeysByCategory(keys, category) {
  const order = FIELD_ORDER[category];
  if (!order) return keys;
  const ordered = [], rest = [], used = {};
  for (let i = 0; i < order.length; i++) {
    for (let j = 0; j < keys.length; j++) { if (!used[j] && keys[j] === order[i]) { ordered.push(keys[j]); used[j] = true; } }
  }
  for (let i = 0; i < order.length; i++) {
    for (let j = 0; j < keys.length; j++) { if (!used[j] && (keys[j].indexOf(order[i]) === 0 || order[i].indexOf(keys[j]) === 0)) { ordered.push(keys[j]); used[j] = true; } }
  }
  for (let j = 0; j < keys.length; j++) { if (!used[j]) rest.push(keys[j]); }
  return ordered.concat(rest);

function copyParameterValue(value) {
  return value == null ? '' : String(value).replace(/[\r\n]+/g,'；').trim();
}
function buildCopyParameters(d, sourceUrl) {
  const s = d.specs || {}, isPhone = d.category === '手机', isProcessor = !d.category;
  const processor = isProcessor ? d : getProcById(d.processor_id);
  const ps = processor ? processor.specs || {} : {};
  const header = [copyParameterValue(d.name) || '未命名设备'];
  const price = copyParameterValue(d.price);
  if (isPhone) {
    const memory = copyParameterValue(s['内存/存储']);
    const config = price.match(/[（(]\s*(\d+)\s*(?:GB)?\s*\+\s*(\d+)\s*(GB|TB)\s*[）)]/i);
    if (config) header.push(config[1]+'GB+'+config[2]+config[3].toUpperCase());
    else if (memory) header.push(memory);
  } else if (d.model) header.push(copyParameterValue(d.model));
  if (!isProcessor) {
    const amount = price.replace(/\s*元\s*/g,'').replace(/[（(]\s*\d+\s*(?:GB)?\s*\+\s*\d+\s*(?:GB|TB)\s*[）)]/gi,'').trim();
    header.push('价格(元)：'+(amount || '未收录'));
  }
  const lines = [header.join('　')];
  const sizeWeight = [s['尺寸'],s['重量']].map(copyParameterValue).filter(Boolean).join(' ');
  if (isPhone) {
    lines.push('屏幕：'+(copyParameterValue(s['屏幕']) || '未收录'));
    lines.push('尺寸重量：'+(sizeWeight || '未收录'));
    lines.push('处理器：'+(copyParameterValue(s['处理器']) || copyParameterValue(processor && processor.name) || '未收录'));
  } else {
    if (d.brand) lines.push('品牌：'+copyParameterValue(d.brand));
    const keys = sortKeysByCategory(Object.keys(s),isProcessor ? '处理器' : d.category);
    keys.forEach(key => {
      if (key.startsWith('---') || /^GeekBench [56] (单核|多核)$/.test(key) || key === '尺寸' || key === '重量') return;
      const value = copyParameterValue(s[key]);
      if (value) lines.push(key+'：'+value);
    });
    if (sizeWeight) lines.push('尺寸重量：'+sizeWeight);
  }
  if (isPhone || isProcessor) {
    [5,6].forEach(version => {
      const single = copyParameterValue(ps['GeekBench '+version+' 单核']);
      const multi = copyParameterValue(ps['GeekBench '+version+' 多核']);
      if (single || multi) lines.push('Geekbench'+version+' 单核：'+(single || '未收录')+'  多核：'+(multi || '未收录'));

    else lines.push('相对性能：未收录');
  }

  return lines.join('\n');
}

el('viewer').addEventListener('close',() => { activePointers.clear(); pointer=null; pinch=null; el('viewer-stage').classList.remove('is-dragging'); resetZoom(); });
el('previous').addEventListener('click',() => setImage(imageIndex-1)); el('next').addEventListener('click',() => setImage(imageIndex+1));
el('zoom-in').addEventListener('click',() => setZoom(zoom+.5)); el('zoom-out').addEventListener('click',() => setZoom(zoom-.5)); el('zoom-reset').addEventListener('click',resetZoom);
el('viewer').addEventListener('keydown',e => { if(e.key==='ArrowLeft') setImage(imageIndex-1); if(e.key==='ArrowRight') setImage(imageIndex+1); });
const viewerStage = el('viewer-stage');
el('viewer-image').addEventListener('dragstart', e => e.preventDefault());
viewerStage.addEventListener('pointerdown', e => {
  if (e.target.closest('button') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  viewerStage.classList.add('is-dragging');
  if (activePointers.size === 1) {
    const swipe = e.pointerType === 'touch' && e.target === viewerStage && zoom === 1 && images.length > 1;
    pointer = {id:e.pointerId,x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY,swipe};
  } else if (activePointers.size === 2) {
    const points = [...activePointers.values()];
    pinch = {distance:Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y),zoom};
    pointer = null;
  }
  viewerStage.setPointerCapture(e.pointerId);
});
viewerStage.addEventListener('pointermove', e => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, {x:e.clientX,y:e.clientY});
  if (pinch && activePointers.size === 2) {
    const points = [...activePointers.values()];
    const distance = Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);
    if (pinch.distance > 0) setZoom(pinch.zoom*distance/pinch.distance);
    return;
  }
  if (!pointer || pointer.id !== e.pointerId || pointer.swipe) return;
  offsetX = pointer.ox + e.clientX - pointer.x;
  offsetY = pointer.oy + e.clientY - pointer.y;
  transformImage();
});
function endViewerPointer(e, cancelled) {
  if (!activePointers.has(e.pointerId)) return;
  if (!cancelled && pointer && pointer.id === e.pointerId && pointer.swipe) {
    const dx = e.clientX - pointer.x, dy = e.clientY - pointer.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) setImage(imageIndex + (dx < 0 ? 1 : -1));
  }
  activePointers.delete(e.pointerId);
  pinch = null;
  pointer = null;
  if (activePointers.size === 1) {
    const [id, point] = activePointers.entries().next().value;
    pointer = {id,x:point.x,y:point.y,ox:offsetX,oy:offsetY,swipe:false};
  } else if (!activePointers.size) viewerStage.classList.remove('is-dragging');
}
viewerStage.addEventListener('pointerup', e => endViewerPointer(e, false));
viewerStage.addEventListener('pointercancel', e => endViewerPointer(e, true));
el('viewer-stage').addEventListener('wheel',e => { e.preventDefault(); setZoom(zoom+(e.deltaY<0?.25:-.25)); },{passive:false});
render();
})();
</script></body></html>
