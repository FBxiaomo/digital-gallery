  --badge-cap-color: #ea580c;
  --badge-cyan-bg: rgba(8,145,178,0.08);
  --badge-cyan-border: rgba(8,145,178,0.15);
  --badge-cyan-color: #0891b2;
  --badge-proc-perf-bg: rgba(22,163,74,0.08);
  --badge-proc-perf-border: rgba(22,163,74,0.15);

  --expand-bar-bg: rgba(0,0,0,0.15);

  --panel-bg: #ffffff;
  --panel-border: rgba(0,0,0,0.06);

  --detail-border: rgba(0,0,0,0.06);

  --surface-subtle: rgba(0,0,0,0.04);
  --perf-bar-track-bg: rgba(0,0,0,0.08);
  --perf-bar-label: rgba(0,0,0,0.5);
  --perf-bar-name: rgba(0,0,0,0.35);
  --slider-track: rgba(0,0,0,0.08);
  --slider-thumb-border: #ffffff;
  --proc-phone-item-bg: rgba(24,95,165,0.08);
  --proc-phone-item-color: #185fa5;
  --proc-link-color: #185fa5;
  --modal-mask: rgba(0,0,0,0.3);
  --modal-bg: #ffffff;
  --modal-shadow: 0 8px 32px rgba(0,0,0,0.12);
  --modal-border: #e0e0db;
  --topbar-bg: rgba(255,255,255,0.72);

  --badge-proto-color: #cbd5e1;
  --badge-purple-bg: rgba(167,139,250,0.2);
  --badge-purple-border: rgba(167,139,250,0.3);
  --badge-purple-color: #c4b5fd;

  --badge-bat-border: rgba(251,113,133,0.3);

  --badge-cap-border: rgba(251,146,60,0.3);

  --badge-cyan-bg: rgba(34,211,238,0.15);
  --badge-cyan-border: rgba(34,211,238,0.25);

  --expand-bar-bg: rgba(255,255,255,0.4);
  --expand-bar-active: rgba(255,255,255,0.5);

.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px double rgba(255,255,255,0.12);box-shadow:inset 2px -2px 1px -1px rgba(255,255,255,0.7),inset -2px 2px 1px -1px rgba(255,255,255,0.7),inset 6px -6px 1px -6px rgba(255,255,255,0.4),inset -6px 6px 1px -6px rgba(255,255,255,0.4),inset 0 0 2px rgba(0,0,0,0.15),0 4px 16px rgba(0,0,0,0.12);transition:background .3s ease,border-color .3s ease,box-shadow .3s ease}
.glass::before{content:'';position:absolute;z-index:-1;top:40%;left:50%;transform:translateX(-50%);width:calc(100% - 12px);height:calc(100% - 12px);border-radius:inherit;border:1px solid rgba(0,0,0,0.6);filter:blur(8px)}
.glass::after{content:'';position:absolute;z-index:1;top:0;left:0;width:100%;height:100%;border-radius:inherit;filter:blur(2px);background:linear-gradient(135deg,rgba(255,255,255,0.6) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.6) 100%);pointer-events:none}

[data-theme="dark"] .glass{background:rgba(255,255,255,0.02);border-color:rgba(255,255,255,0.04);box-shadow:inset 2px -2px 1px -1px rgba(255,255,255,0.25),inset -2px 2px 1px -1px rgba(255,255,255,0.25),inset 6px -6px 1px -6px rgba(255,255,255,0.1),inset -6px 6px 1px -6px rgba(255,255,255,0.1),inset 0 0 2px rgba(0,0,0,0.3),0 4px 16px rgba(0,0,0,0.3)}
[data-theme="dark"] .glass::before{border-color:rgba(0,0,0,0.8)}
[data-theme="dark"] .glass::after{background:linear-gradient(135deg,rgba(255,255,255,0.08) 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.08) 100%)}
[data-theme="dark"] .fab-toggle.glass::after{background:linear-gradient(90deg,transparent 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.08) 100%)}
[data-theme="dark"] .topbar.glass{border:none;border-bottom:1px solid rgba(255,255,255,0.04);box-shadow:inset 0 -2px 1px -1px rgba(255,255,255,0.1),0 4px 16px rgba(0,0,0,0.3)}
.drawer.glass::before,.fab-toggle.glass::before{display:none}
.fab-toggle.glass::after{background:linear-gradient(90deg,transparent 0%,transparent 30%,transparent 70%,rgba(255,255,255,0.6) 100%)}
[data-theme="dark"] .search-inner #search-input{border-color:transparent;background:rgba(255,255,255,0.03)}
[data-theme="dark"] .search-inner #search-input:focus{border-color:transparent}
[data-theme="dark"] .search-inner .search-clear{background:rgba(255,255,255,0.08)}
[data-theme="dark"] .search-inner .search-clear:hover{background:rgba(255,255,255,0.15)}
[data-theme="dark"] .search-inner .search-btn{border-color:rgba(255,255,255,0.08);background:rgba(255,255,255,0.06);box-shadow:inset 1px -1px 1px -1px rgba(255,255,255,0.3),inset -1px 1px 1px -1px rgba(255,255,255,0.3),0 2px 8px rgba(0,0,0,0.2)}
[data-theme="dark"] .search-inner .search-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.15)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
html{scrollbar-gutter:stable}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

.topbar{position:sticky;top:0;z-index:100;background:var(--topbar-bg);border-bottom:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px}
.topbar h1,.topbar .sort-group{position:relative;z-index:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15))}
.topbar h1{font-size:18px;font-weight:600;display:flex;align-items:center}
.site-logo{height:30px;width:30px;border-radius:6px;vertical-align:middle;margin-right:6px;transition:transform .35s cubic-bezier(.22,1,.36,1);cursor:pointer;display:inline-block}
.site-logo:hover{transform:rotate(15deg)}
.sort-group{display:flex;align-items:center;gap:4px;flex-shrink:0}
.sort-btn{font-size:11px;padding:4px 9px;border-radius:6px;border:0.5px solid var(--border);background:var(--card-bg);color:var(--text2);cursor:pointer;transition:border-color .15s,color .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.sort-btn:hover{background:var(--primary-bg);border-color:var(--primary)}
.sort-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.about-mask,.changelog-mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--modal-mask);z-index:200;align-items:center;justify-content:center;padding:20px}
.about-mask.open,.changelog-mask.open{display:flex}
.about-panel,.changelog-panel{background:var(--modal-bg);border-radius:24px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;padding:24px 28px;position:relative;box-shadow:var(--modal-shadow);border:0.5px solid var(--modal-border)}
.about-panel.glass,.changelog-panel.glass{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px double rgba(255,255,255,0.12);box-shadow:inset 2px -2px 1px -1px rgba(255,255,255,0.7),inset -2px 2px 1px -1px rgba(255,255,255,0.7),inset 6px -6px 1px -6px rgba(255,255,255,0.4),inset -6px 6px 1px -6px rgba(255,255,255,0.4),inset 0 0 2px rgba(0,0,0,0.15),0 4px 16px rgba(0,0,0,0.12)}
.about-panel.glass::after,.changelog-panel.glass::after{display:none}
[data-theme="dark"] .about-panel.glass,[data-theme="dark"] .changelog-panel.glass{background:rgba(26,26,26,0.92);border-color:rgba(255,255,255,0.04);box-shadow:inset 2px -2px 1px -1px rgba(255,255,255,0.25),inset -2px 2px 1px -1px rgba(255,255,255,0.25),inset 6px -6px 1px -6px rgba(255,255,255,0.1),inset -6px 6px 1px -6px rgba(255,255,255,0.1),inset 0 0 2px rgba(0,0,0,0.3),0 4px 16px rgba(0,0,0,0.3)}
.about-panel h3,.changelog-panel h3{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.about-close,.changelog-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2);padding:0 4px}
.about-close:hover,.changelog-close:hover{color:var(--text)}
.about-body{font-size:13px;line-height:1.8}
.about-body hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.about-body h4{font-size:14px;font-weight:600;margin:8px 0 4px}
.about-body a{color:var(--primary);text-decoration:none}
.about-body a:hover{text-decoration:underline}
.perf-note{font-size:13px;color:var(--text);margin-bottom:12px}
.perf-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
.perf-table th,.perf-table td{padding:6px 8px;border-bottom:0.5px solid var(--border);text-align:left}
.perf-table th{background:var(--surface-subtle);font-weight:600;color:var(--text)}

.changelog-list{list-style:none}
.changelog-list li{font-size:13px;color:var(--text);padding:10px 0;border-bottom:0.5px solid var(--border);line-height:1.6}
.changelog-list li:last-child{border-bottom:none}
.changelog-date{font-size:11px;color:var(--text2);font-weight:500}
.changelog-devices{display:none;margin-top:6px;padding:6px 8px;background:var(--changelog-devices-bg);border-radius:6px;font-size:12px;color:var(--text);line-height:1.8}
.changelog-devices.open{display:block}
.changelog-toggle{font-size:11px;color:var(--primary);cursor:pointer;border:none;background:none;padding:0;margin-top:4px}
.changelog-toggle:hover{text-decoration:underline}

.main{display:flex;min-height:calc(100vh - 56px)}
.drawer-mask{display:contents}
.drawer{width:180px;flex-shrink:0;padding:16px 0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;display:flex;flex-direction:column;background:var(--drawer-bg)}
.drawer h3{font-size:11px;color:var(--text3);letter-spacing:1px;padding:0 20px;margin-bottom:8px}
.drawer-list{list-style:none;padding:0;margin:0}
.drawer-item{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;cursor:pointer;border-left:3px solid transparent;transition:border-color .15s,color .15s;color:var(--text2)}
.drawer-item:hover{background:var(--primary-bg)}
.drawer-item.active{border-left-color:var(--primary);background:var(--primary-bg);color:var(--primary);font-weight:500}
.drawer-theme-wrap{position:relative;margin-top:auto;width:calc(100% - 24px);margin-left:12px;margin-right:12px;display:flex;border-top:0.5px solid var(--drawer-border);height:36px;align-items:center}
.theme-anchor{position:relative;height:36px;width:62px;flex-shrink:0;overflow:visible;z-index:11}
.theme-selector{position:absolute;bottom:0;left:0;border-radius:999px;overflow:hidden;cursor:pointer;transition:max-height .35s cubic-bezier(.22,1,.36,1);max-height:36px}
.theme-selector.open{max-height:108px}
.theme-selector-track{transition:transform .35s cubic-bezier(.22,1,.36,1)}
.theme-option{height:36px;line-height:36px;padding:0 16px;font-size:13px;text-align:center;color:var(--text2);cursor:pointer;transition:color .15s;white-space:nowrap}
.theme-option:hover{color:var(--primary)}
.theme-option.active{color:var(--text);font-weight:500}
.side-btns{position:absolute;right:0;bottom:0;display:flex;gap:6px;z-index:12}
.side-btn{width:36px;height:36px;border-radius:999px;border:0.5px solid var(--border);background:var(--card-bg);color:var(--text3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s}
.side-btn:hover{background:var(--primary-bg);color:var(--primary)}
[data-theme="dark"] .theme-selector.glass,[data-theme="dark"] .side-btn{background:rgba(0,0,0,0.2);border-color:rgba(0,0,0,0.15);box-shadow:inset 1px -1px 1px -1px rgba(255,255,255,0.08),inset -1px 1px 1px -1px rgba(255,255,255,0.08),0 2px 8px rgba(0,0,0,0.3);color:var(--text)}
.content{flex:1;padding:24px}
.content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.content-header h2{font-size:20px;font-weight:600}

.search-bar-bottom{position:fixed;bottom:8px;left:16px;right:16px;z-index:90;border-radius:24px}
.search-inner{position:relative;display:flex;align-items:center;padding:6px}
.search-inner #search-input{flex:1;padding:10px 14px;padding-right:68px;font-size:14px;border:0.5px solid transparent;border-radius:999px;background:rgba(255,255,255,0.06);color:var(--text);outline:none;transition:border-color .15s}
.search-inner #search-input:focus{border-color:transparent}
.search-inner #search-input::placeholder{color:var(--text3)}
.search-inner .search-clear{display:none;position:absolute;right:50px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,0.15);color:var(--text3);font-size:14px;cursor:pointer;align-items:center;justify-content:center}
.search-inner .search-clear:hover{background:rgba(255,255,255,0.25);color:var(--text)}
.search-inner .search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.1);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:inset 1px -1px 1px -1px rgba(255,255,255,0.5),inset -1px 1px 1px -1px rgba(255,255,255,0.5),0 2px 8px rgba(0,0,0,0.1)}
.search-inner .search-btn:hover{background:rgba(255,255,255,0.18);border-color:rgba(255,255,255,0.25)}
.device-count{font-size:13px;color:var(--text3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding-bottom:24px}
#grid{position:relative}

/* ===== 卡片（三层叠加：bg → mask → content） ===== */
.card{position:relative;overflow:hidden;min-height:170px;border-radius:24px;background:var(--card-bg);box-shadow:var(--card-shadow);cursor:pointer;transition:box-shadow .3s ease,transform .3s ease,min-height .15s ease-out;contain:layout style paint;content-visibility:auto;contain-intrinsic-size:260px 170px}
.card::before{content:'';position:absolute;inset:0;z-index:0;border-radius:inherit;background:radial-gradient(ellipse 80% 70% at 80% 50%,var(--card-glow),transparent 70%);opacity:0;transition:opacity .6s cubic-bezier(.22,1,.36,1);pointer-events:none;transform:none;width:100%;height:100%;border:none;filter:none}
.card[data-cat-type="device"].has-img.expanded::before{opacity:0.3}
.card:hover{transform:translateY(-2px);box-shadow:var(--card-shadow-hover);will-change:transform}
.card.expanded{min-height:200px;content-visibility:visible}

/* Layer 0: 产品图/品牌渐变背景 */
.card-bg{position:absolute;inset:0;z-index:0;border-radius:inherit;opacity:0.6;background-size:contain;background-repeat:no-repeat;background-position:88% center;transform:translateX(0) scale(1);transition:transform .8s cubic-bezier(.22,1,.36,1),opacity .6s ease,background-position .6s cubic-bezier(.22,1,.36,1),z-index 0s}
.card-bg.bg-init{opacity:0;transform:translateX(60px) scale(0.9)}
.card:hover .card-bg{transform:scale(1.05) translateX(-5px);opacity:0.85}
.card[data-cat-type="device"].has-img.expanded .card-bg{z-index:3;background-position:center center;transform:scale(1.1);opacity:1}

/* Layer 1: 斜向渐变遮罩 */
.card-mask{position:absolute;inset:0;z-index:1;border-radius:inherit;background:linear-gradient(100deg,var(--card-mask-from) 0%,var(--card-mask-mid) 30%,var(--card-mask-to) 55%,transparent 80%);transition:opacity .5s cubic-bezier(.22,1,.36,1)}

/* Layer 2: 内容层 */

.card[data-cat-type="device"].has-img.expanded .card-head{opacity:0.25}
/* 处理器卡片：展开时隐藏背景光晕 */
.card[data-cat-type="processor"].has-img.expanded::before{opacity:0}
.card-name{font-size:15px;font-weight:450;margin-bottom:8px;line-height:1.3;flex:1;min-width:0;color:var(--text);text-shadow:var(--card-name-shadow);font-family:'SmileySans',sans-serif}

(function() {
'use strict';

(function initTheme() {
  var saved = localStorage.getItem('theme');
  if (saved === 'auto') {
    var mql = window.matchMedia('(prefers-color-scheme: dark)');
    document.documentElement.setAttribute('data-theme', mql.matches ? 'dark' : 'light');
    updateThemeIcon('auto');
    mql.addEventListener('change', function(e) {
      if (localStorage.getItem('theme') === 'auto') {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        updateThemeIcon('auto');
      }
    });
    return;
  }
  if (!saved) {
    saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon(saved);
})();

function updateThemeIcon(mode) {
  var theme = document.documentElement.getAttribute('data-theme');
  var selector = document.getElementById('theme-selector');
  var track = document.getElementById('theme-selector-track');
  if (!selector || !track) return;
  
  var options = track.querySelectorAll('.theme-option');
  var activeIndex = 0;
  options.forEach(function(opt, idx) {
    var val = opt.dataset.value;
    var isActive = (mode === 'auto' && val === 'auto') || 
                   (mode !== 'auto' && val === theme);
    opt.classList.toggle('active', isActive);
    if (isActive) activeIndex = idx;
  });
  
  var optionHeight = 36;
  var targetOffset = -activeIndex * optionHeight;
  
  if (selector.classList.contains('open')) {
    track.style.transform = 'translateY(0)';
  } else {
    track.style.transform = 'translateY(' + targetOffset + 'px)';
  }
}

function refreshAllSliders() {
  refreshPerfColors();
  document.querySelectorAll('.perf-slider').forEach(function(slider) {
    var val = parseInt(slider.value);
    var color = getPerfColor(val);
    slider.style.background = 'linear-gradient(to right, ' + color + ' ' + (val/200*100) + '%, var(--slider-track) ' + (val/200*100) + '%)';
  });
}

function setTheme(val) {
  document.documentElement.setAttribute('data-theme', val);
  localStorage.setItem('theme', val);
  updateThemeIcon(val);
  refreshAllSliders();
}

function followSystemTheme() {
  localStorage.setItem('theme', 'auto');
  var mql = window.matchMedia('(prefers-color-scheme: dark)');
  document.documentElement.setAttribute('data-theme', mql.matches ? 'dark' : 'light');
  updateThemeIcon('auto');
  refreshAllSliders();
}

var _searchIndex = new Map();
var _searchIndexLite = new Map();
function buildSearchIndex() {
  for (let i = 0; i < devices.length; i++) {
    const d = devices[i];
    const baseParts = [d.name || '', d.brand || '', d.model || ''];
    if (d.tags) baseParts.push(d.tags.join(' '));
    if (d.processor_id) { const proc = processorsMap[d.processor_id]; if (proc) baseParts.push(proc.name); }
    const liteText = baseParts.join(' ').toLowerCase();
    _searchIndexLite.set(d, { text: liteText, textNorm: liteText.replace(/[\s\-_]/g, ''),
      nameNorm: (d.name || '').toLowerCase().replace(/[\s\-_]/g, ''),

  if (privStr) { const privBrands = privStr.split(/[；;]/); for (let bi = 0; bi < privBrands.length; bi++) { const bSeg = privBrands[bi].trim(); if (!bSeg) continue; const ci = Math.max(bSeg.indexOf('：'), bSeg.indexOf(':')); const brandName = ci > 0 ? bSeg.substring(0, ci).trim() : bSeg; const watts = bSeg.match(/(\d+)W/g); let maxW = 0; if (watts) { for (let wi = 0; wi < watts.length; wi++) { const w = parseInt(watts[wi]); if (w > maxW) maxW = w; } } if (brandName && maxW > 0) protocols.push(brandName + ' ' + maxW + 'W'); } }
  if (protoAll.indexOf('UFCS') > -1) protocols.push('UFCS 33W');
  if (protoAll.indexOf('QC') > -1) protocols.push('QC');
  if (protoAll.indexOf('FCP') > -1) protocols.push('FCP');
  if (protoAll.indexOf('SCP') > -1) protocols.push('SCP');
  return { power: power, port: port, protocols: protocols, capacity: s['电池容量'] || '' };
}

function buildCardBg(item) {
  var bg, mask = '<div class="card-mask"></div>';
  var catMap = {'手机':'phones','充电器':'chargers','充电宝':'powerbanks'};
  var cat = catMap[item.category] || '';
  var exts = ['.webp'];
  var brand = item.brand || '';
  var candidates = [];
  if (item.image) candidates.push(item.image);
  if (cat) {
    var names = [];
    if (item.id) names.push(item.id);
    if (item.model) names.push(item.model);
    if (item.name) names.push(item.name.replace(/\s+/g, ''));
    // 生成多种命名风格的候选路径
    for (var n = 0; n < names.length; n++) {
      var rawName = names[n];
      for (var e = 0; e < exts.length; e++) {
        var ext = exts[e];
        var path = 'db/images/' + cat + '/' + rawName + ext;
        if (candidates.indexOf(path) === -1) candidates.push(path);
        var noHyphen = rawName.replace(/-/g, '');
        if (noHyphen !== rawName) {
          var path2 = 'db/images/' + cat + '/' + noHyphen + ext;
          if (candidates.indexOf(path2) === -1) candidates.push(path2);
        }
        var capitalized = rawName.replace(/(^|-)([a-z])/g, function(m, p1, p2) { return (p1 || '') + p2.toUpperCase(); });
        if (capitalized !== rawName) {
          var path3 = 'db/images/' + cat + '/' + capitalized + ext;
          if (candidates.indexOf(path3) === -1) candidates.push(path3);
        }
        var capNoHyphen = capitalized.replace(/-/g, '');
        if (capNoHyphen !== rawName) {
          var path4 = 'db/images/' + cat + '/' + capNoHyphen + ext;
          if (candidates.indexOf(path4) === -1) candidates.push(path4);
        }
      }
    }
  }
  // 品牌 logo 兜底（取中文品牌名，如 "小米 Xiaomi" -> "小米"）
  var brandCn = brand.split(' ')[0];
  if (brandCn) {
    for (var b = 0; b < exts.length; b++) {
      var logoPath = 'logo/' + brandCn + 'logo' + exts[b];

  if (candidates.length) {
    bg = '<div class="card-bg bg-init" data-img-candidates="' + esc(JSON.stringify(candidates)) + '"></div>';
  } else {
    bg = '<div class="card-bg"></div>';
  }
  return bg + mask;
}

function tryLoadImage(bg, candidates, idx, card) {
  if (idx >= candidates.length) {
    // 所有图片都失败，留空白背景
    bg.classList.remove('bg-init');
    return;
  }
  var src = candidates[idx];
  var srcV = src + '?v=' + IMG_V;
  // JS内存缓存：已加载过的图片直接使用，跳过网络请求
  if (imgCache[srcV]) {
    bg.style.backgroundImage = 'url(' + imgCache[srcV] + ')';
    if (card && card.isConnected) card.classList.add('has-img');
    bg.classList.remove('bg-init');
    requestAnimationFrame(function() { bg.classList.add('bg-init'); requestAnimationFrame(function() { bg.classList.remove('bg-init'); }); });
    return;
  }
  var img = new Image();
  img.decoding = 'async';
  var done = false;
  var timer = setTimeout(function() { if (!done && !img.complete) img.onerror && img.onerror(); }, 5000);
  function onSuccess() {
    if (done) return; done = true;
    clearTimeout(timer);
    if (!bg.isConnected) return;
    imgCache[srcV] = srcV;
    bg.style.backgroundImage = 'url(' + srcV + ')';
    if (card && card.isConnected) card.classList.add('has-img');
    bg.classList.remove('bg-init');
    requestAnimationFrame(function() { bg.classList.add('bg-init'); requestAnimationFrame(function() { bg.classList.remove('bg-init'); }); });
  }
  img.onload = onSuccess;
  img.onerror = function() {
    if (done) return;
    clearTimeout(timer);
    tryLoadImage(bg, candidates, idx + 1, card);
  };
  img.src = srcV;
  if (img.complete) onSuccess();
}

var _imgIO = null;
function bindImgErrors(container) {
  var els = container.querySelectorAll('.card-bg[data-img-candidates]');
  if (!els.length) return;
  if ('IntersectionObserver' in window) {
    if (_imgIO) _imgIO.disconnect();
    _imgIO = new IntersectionObserver(function(entries) {
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].isIntersecting) {
          _imgIO.unobserve(entries[i].target);
          loadImageForBg(entries[i].target);
        }
      }
    }, { rootMargin: '300px' });
    els.forEach(function(el) { _imgIO.observe(el); });
  } else {
    els.forEach(function(el) { loadImageForBg(el); });
  }
}

function loadImageForBg(bg) {
  var raw = bg.getAttribute('data-img-candidates');
  if (!raw) return;
  var candidates;
  try { candidates = JSON.parse(raw); } catch(e) { return; }
  if (!candidates || !candidates.length) return;
  var card = bg.closest('.card');
  tryLoadImage(bg, candidates, 0, card);
}

function getFilteredDevices() {
  let filtered = [];
  if (currentCat === '全部') { for (let fi = 0; fi < devices.length; fi++) filtered.push(devices[fi]); }
  else { for (let fi = 0; fi < devices.length; fi++) { if (devices[fi].category === currentCat) filtered.push(devices[fi]); } }
  if (searchQuery) {
    const scoreMap = new Map(), searchFiltered = [];
    for (let fi = 0; fi < filtered.length; fi++) { const sc = smartSearch(filtered[fi]); if (sc) { scoreMap.set(filtered[fi], sc); searchFiltered.push(filtered[fi]); } }
    filtered = searchFiltered;
    filtered.sort(function(a, b) { return scoreMap.get(b) - scoreMap.get(a); });
    return filtered;
  }
  return sortDevices(filtered);
}

function getSortedProcessors() {
  if (typeof processors === 'undefined') return [];
  let sorted = processors.slice();
  if (searchQuery) {
    const scoreMap = new Map(), filtered = [];
    for (let si = 0; si < processors.length; si++) { const sc = smartProcSearch(processors[si]); if (sc) { scoreMap.set(processors[si], sc); filtered.push(processors[si]); } }
    sorted = filtered;
    sorted.sort(function(a, b) { return scoreMap.get(b) - scoreMap.get(a); });
  } else {
    sorted.sort(function(a, b) {
      let va, vb;
      if (currentSortField === 'perf') { const ca = sortCache.get(a) || {}, cb = sortCache.get(b) || {}; va = ca.perf || 0; vb = cb.perf || 0; }
      else if (currentSortField === 'release_date') { va = (a.specs || {})['发布日期'] || ''; vb = (b.specs || {})['发布日期'] || ''; }
      else { va = a.name || ''; vb = b.name || ''; }
      if (va < vb) return currentSortDir === 'asc' ? -1 : 1; if (va > vb) return currentSortDir === 'asc' ? 1 : -1; return 0;
    });
  }
  return sorted;
}

function toggleCard(el, idx) {

    var cacheKey = detailRef.type + '-' + (detailRef.ref.id || idx);
    if (!detailCache[cacheKey]) {
      if (detailRef.type === 'processor') {
        detailCache[cacheKey] = buildProcDetail(detailRef.ref);
      } else {
        detailCache[cacheKey] = buildDeviceDetail(detailRef.ref, idx);
      }
    }
    detailHtml = detailCache[cacheKey];
  }
  const wasExpanded = el.classList.contains('expanded');
  const grid = document.getElementById('grid');
  const bar = el.querySelector('.card-expand-bar');
  const cards = document.querySelectorAll('.card.expanded');
  cards.forEach(function(c) {
    if (c !== el) {
      c.classList.remove('expanded');
      var otherBar = c.querySelector('.card-expand-bar');
      if (otherBar) otherBar.classList.remove('expanding');
    }
  });
  closeActivePanel();

var _observeMap = {};
var panelObserver = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    var el = entry.target;
    var idx = el.dataset.observeIdx;
    var type = el.dataset.observeType;
    if (!idx || !type) return;
    if (!_observeMap[idx]) _observeMap[idx] = {};
    _observeMap[idx][type] = entry.isIntersecting;
    var map = _observeMap[idx];
    if (map.card === false && map.panel === false) {
      var card = document.querySelector('.card[data-idx="' + CSS.escape(idx) + '"]');
      if (card && card.classList.contains('expanded')) {
        toggleCard(card, parseInt(idx));
      }
    }
  });
}, { threshold: 0 });

function observePanel(panel, card) {
  var idx = card.dataset.idx;
  card.dataset.observeIdx = idx;
  card.dataset.observeType = 'card';
  panel.dataset.observeIdx = idx;
  panel.dataset.observeType = 'panel';
  _observeMap[idx] = { card: true, panel: true };
  panelObserver.observe(card);
  panelObserver.observe(panel);
}

function validateData() {
  const warnings = [], pids = {};
  if (typeof processors !== 'undefined') { for (let i = 0; i < processors.length; i++) { const p = processors[i]; if (!p.id) { warnings.push('处理器 "' + (p.name || '(无名)') + '" 缺少 id'); continue; } if (pids[p.id]) warnings.push('处理器 id "' + p.id + '" 重复'); pids[p.id] = true; if (!p.name) warnings.push('处理器 id="' + p.id + '" 缺少 name'); if (!p.brand) warnings.push('处理器 id="' + p.id + '" 缺少 brand'); if (!p.specs) warnings.push('处理器 id="' + p.id + '" 缺少 specs'); } }
  for (let j = 0; j < devices.length; j++) { const d = devices[j]; if (!d.name) warnings.push('设备 index=' + j + ' 缺少 name'); if (!d.category) warnings.push('设备 "' + (d.name || j) + '" 缺少 category'); if (!d.specs) warnings.push('设备 "' + (d.name || j) + '" 缺少 specs'); if (d.processor_id && !pids[d.processor_id]) warnings.push('设备 "' + d.name + '" 的 processor_id "' + d.processor_id + '" 不存在'); }
  if (warnings.length) console.warn('[数码图鉴] 数据校验 (' + warnings.length + '):\n' + warnings.join('\n'));
}

function setupEventDelegation() {
  const grid = document.getElementById('grid');
  grid.addEventListener('click', function(e) {
    const phoneItem = e.target.closest('.proc-phone-item');
    if (phoneItem) { e.stopPropagation(); const pid = phoneItem.dataset.phoneId; if (pid) jumpToPhone(pid); return; }
    const procLink = e.target.closest('.proc-link');
    if (procLink) { e.stopPropagation(); const pid = procLink.dataset.procId; if (pid) { filterCat('处理器'); setTimeout(function() { var t = document.querySelector('.card[data-id="' + CSS.escape(pid) + '"]'); if (t) { t.click(); t.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }, 100); } return; }
    const card = e.target.closest('.card');
    if (!card) return;
    if (e.target.closest('.perf-slider')) return;
    if (e.target.closest('.card-detail-panel')) return;
    toggleCard(card, parseInt(card.dataset.idx));
  });
  grid.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { const card = e.target.closest('.card'); if (card && !e.target.closest('.card-detail-panel')) { e.preventDefault(); card.click(); } } });
  document.getElementById('sort-buttons').addEventListener('click', function(e) { const btn = e.target.closest('.sort-btn'); if (btn && btn.dataset.sortField) toggleSort(btn.dataset.sortField); });
  document.getElementById('drawer-toggle').addEventListener('click', openDrawer);
  drawerMask.addEventListener('click', function(e) { if (e.target === drawerMask) closeDrawer(); });
  document.querySelector('.drawer-list').addEventListener('click', function(e) { const item = e.target.closest('.drawer-item'); if (item && item.dataset.cat) filterCat(item.dataset.cat); });
  document.getElementById('search-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); handleSearch(); } if (e.key === 'Escape') { document.getElementById('search-input').blur(); } });
  document.getElementById('search-input').addEventListener('input', function() {
    toggleClearBtn();
    if (this.value.trim() === '33550336' && !window.__loopCollapse) {
      this.value = ''; toggleClearBtn();
      var s = document.createElement('script');
      s.src = 'easter-egg.js'; s.async = true;
      document.body.appendChild(s);
    }
  });
  document.getElementById('search-btn').addEventListener('click', handleSearch);
  document.getElementById('search-clear').addEventListener('click', clearSearch);
  document.getElementById('drawer-theme').addEventListener('click', function(e) {
    var selector = document.getElementById('theme-selector');
    var track = document.getElementById('theme-selector-track');
    var option = e.target.closest('.theme-option');
    
    if (!selector.classList.contains('open')) {
      selector.classList.add('open');
      track.style.transform = 'translateY(0)';
      return;
    }
    
    if (option) {
      var val = option.dataset.value;
      var options = track.querySelectorAll('.theme-option');
      var newActiveIndex = 0;
      options.forEach(function(opt, idx) {
        if (opt.dataset.value === val) newActiveIndex = idx;
      });
      
      var optionHeight = 36;
      var newOffset = -newActiveIndex * optionHeight;
      selector.classList.remove('open');
      track.style.transform = 'translateY(' + newOffset + 'px)';
      
      if (val === 'auto') {
        followSystemTheme();
      } else {
        setTheme(val);
      }
    }
  });
  document.addEventListener('click', function(e) {
    var sel = document.getElementById('theme-selector');
    if (sel && sel.classList.contains('open') && !sel.contains(e.target)) closeThemeSelector();
  });
  document.getElementById('btn-changelog').addEventListener('click', function(e) { e.stopPropagation(); toggleChangelog(); });
  document.getElementById('btn-about').addEventListener('click', function(e) { e.stopPropagation(); toggleAbout(); });
  document.getElementById('changelog-close').addEventListener('click', toggleChangelog);
  document.getElementById('about-close').addEventListener('click', toggleAbout);
  document.getElementById('changelog-mask').addEventListener('click', function(e) { if (e.target === this) toggleChangelog(); });
  document.getElementById('about-mask').addEventListener('click', function(e) { if (e.target === this) toggleAbout(); });
  document.getElementById('changelog-list').addEventListener('click', function(e) { const t = e.target.closest('.changelog-toggle'); if (t) { const dd = t.nextElementSibling; if (dd) { dd.classList.toggle('open'); t.textContent = dd.classList.contains('open') ? '收起设备▼' : '查看新增设备 ▶'; } } });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { const sel = document.getElementById('theme-selector'); if (sel && sel.classList.contains('open')) { closeThemeSelector(); return; } const cl = document.getElementById('changelog-mask'), ab = document.getElementById('about-mask'); if (cl.classList.contains('open')) toggleChangelog(); else if (ab.classList.contains('open')) toggleAbout(); else if (document.querySelector('.card.expanded')) closeActivePanel(); } });
  var sliderRafId = null;
  grid.addEventListener('input', function(e) {
    const slider = e.target.closest('.perf-slider');
    if (!slider) return;
    const val = parseInt(slider.value);
    const realVal = parseFloat(slider.dataset.real) || 1;
    const card = slider.closest('.card');
    const trackColor = getPerfColor(val);
    slider.style.background = 'linear-gradient(to right, ' + trackColor + ' ' + (val/200*100) + '%, var(--slider-track) ' + (val/200*100) + '%)';
    if (card) { const badgeVal = card.querySelector('.perf-dyn-val'); if (badgeVal) badgeVal.textContent = val; }
    if (sliderRafId) cancelAnimationFrame(sliderRafId);
    sliderRafId = requestAnimationFrame(function() {
      sliderRafId = null;
      grid.querySelectorAll('.perf-slider').forEach(function(other) {
        if (other === slider) return;
        var otherNew = Math.round((parseFloat(other.dataset.real) || 1) / realVal * val);
        other.value = otherNew;
        var otherCard = other.closest('.card');
        if (otherCard) { var b = otherCard.querySelector('.perf-dyn-val'); if (b) b.textContent = otherNew; }
        other.style.background = 'linear-gradient(to right, ' + getPerfColor(otherNew) + ' ' + (otherNew/200*100) + '%, var(--slider-track) ' + (otherNew/200*100) + '%)';
      });
    });
  });
  grid.addEventListener('mousedown', function(e) { if (e.target.closest('.perf-slider')) e.stopPropagation(); });
  grid.addEventListener('touchstart', function(e) { if (e.target.closest('.perf-slider')) e.stopPropagation(); }, { passive: true });
  grid.addEventListener('click', function(e) { if (e.target.closest('.perf-slider')) e.stopPropagation(); });
  grid.addEventListener('dblclick', function(e) {
    var slider = e.target.closest('.perf-slider');
    if (!slider) return;
    e.stopPropagation();
    slider.value = 100;
    slider.dispatchEvent(new Event('input', { bubbles: true }));
  });
}

try {
  validateData(); renderChangelog(); updateSortButtons(); setupEventDelegation(); render();
} catch(e) {
  const g = document.getElementById('grid');
  if (g) g.innerHTML = '<div class="empty"><p class="error-text">加载出错，请刷新页面重试</p></div>';
  console.error('[数码图鉴]', e);
}
})();
</script>
</body>
